<style>
:root{--bg:#dcecf6;--card:rgba(255,255,255,.8);--sol:#fff;--tx:#10201d;--mu:#55696a;--ln:#d3dfdc;--ac:#0f4c45;--in:#1b8a5a;--out:#d9503f;--wa:#d99a1e;--sky:linear-gradient(180deg,#bfdcf7 0%,#dcebfa 36%,#ecf6f4 64%,#cdeee8 100%);--b1:#c2b0ff;--b2:#9ec6ff;--b3:#86ecd9;--halo:#fff2c466;--spo:.45;--cg:#fff;--calm:#eef6fbcc;--hz:#ffe3c077;--w1a:#7fe0d2e6;--w1b:#2fb0adf2;--w2a:#a7c9ffd9;--w2b:#5b8fe6f2;--orb:radial-gradient(circle at 35% 35%,#fff6c9,#ffc83d 60%,#ff9d2e);--orbg:#ffb83d99;--sh:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#050814;--card:rgba(13,21,40,.74);--sol:#111b2e;--tx:#e8f0ee;--mu:#93aaa5;--ln:#ffffff1f;--ac:#23917f;--in:#3fcf8e;--out:#ff7a68;--sky:linear-gradient(180deg,#01020a 0%,#070b24 34%,#0a1238 62%,#0b2c4d 100%);--b1:#7c3aed;--b2:#4f46e5;--b3:#14e3c8;--halo:#9db4ff40;--spo:.6;--cg:#bff6ff;--calm:#050814cc;--hz:#19d3c24d;--w1a:#13b8a899;--w1b:#06485ae6;--w2a:#6d4cf799;--w2b:#1a1766e6;--orb:radial-gradient(circle at 34% 38%,#c6cde2 0 6%,#0000 7%),radial-gradient(circle at 64% 30%,#c9d0e4 0 4.5%,#0000 5.5%),radial-gradient(circle at 56% 68%,#c3cade 0 8%,#0000 9%),radial-gradient(circle at 36% 30%,#fff,#f1f3ff 55%,#c9d2f0);--orbg:#c9d6ff80;--sh:block}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;max-width:520px;margin:auto}
main{padding:10px 14px 130px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:6px 0 12px}
h4{font-size:15px;margin-bottom:8px}
.cd{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.hero{background:var(--ac);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px}
.hero small{color:#ffffffb3}.big{font-size:40px;font-weight:800;letter-spacing:-1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.g2 .cd{margin:0}.g2 b{font-size:19px}
small{color:var(--mu);font-size:13px;display:block}
.in{color:var(--in)}.out{color:var(--out)}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-transform:capitalize;font-weight:700}
.mn button{background:var(--card);border:1px solid var(--ln);color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:20px}
.rw{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.rw:last-child{border:0}
.rw>div{flex:1;min-width:0}.rw>div b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.pr{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:7px 0}.pr i{display:block;height:100%;border-radius:9px}
.ch{display:flex;gap:8px}.ch>div{flex:1;text-align:center}
.bars{height:100px;display:flex;gap:3px;align-items:flex-end}.bars i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.b{border:0;border-radius:12px;padding:13px 12px;font:inherit;font-weight:600;background:var(--bg);color:var(--tx);flex:1}
.b.p{background:var(--ac);color:#fff}.b.d{background:var(--out);color:#fff}.b:disabled{opacity:.6}
.row{display:flex;gap:8px;margin-top:12px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu);display:block}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:var(--card);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto}
.tb button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center}
.tb button span{font-size:22px}.tb .on{color:var(--ac);font-weight:800}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tb .on{color:var(--in)}}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 6px 18px #0004}
#sh .bk{position:fixed;inset:0;background:#0007}
#sh .pn{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--sol);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#to{width:max-content;max-width:90vw;text-align:center;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-120px);background:#222;color:#fff;padding:10px 16px;border-radius:20px;transition:.3s;z-index:9}#to.on{transform:translate(-50%,0)}
.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--bg);color:var(--mu);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)}td:first-child,th:first-child{text-align:left}.tw{overflow:auto;max-height:60vh;padding:4px}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--sky)}.bg canvas{position:absolute;inset:0;width:100%;height:100%}.bg .cm{position:absolute;inset:0;background:radial-gradient(ellipse 72% 46% at 50% 52%,var(--calm),transparent 78%)}
.ent>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}.ent>:nth-child(2){animation-delay:.05s}.ent>:nth-child(3){animation-delay:.1s}.ent>:nth-child(4){animation-delay:.15s}.ent>:nth-child(n+5){animation-delay:.2s}@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
#sh .pn{animation:sup .32s cubic-bezier(.2,.8,.2,1)}#sh .bk{animation:fi .25s}@keyframes sup{from{transform:translateY(100%)}}@keyframes fi{from{opacity:0}}
.b,.fab,.tb button,.mn button{transition:transform .15s}.b:active,.fab:active,.tb button:active,.mn button:active{transform:scale(.93)}
.rw.nw{animation:nw 1.8s ease-out}@keyframes nw{0%{background:var(--ac);box-shadow:0 0 0 6px var(--ac)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
.hero.gout{animation:go 1.2s}.hero.gin{animation:gi 1.2s}@keyframes go{40%{box-shadow:0 0 50px 8px #ff7a68cc}}@keyframes gi{40%{box-shadow:0 0 50px 8px #ffd76acc}}
#fx{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}#fx i{position:absolute}
.coin{top:13%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#c98a00);box-shadow:0 0 12px #ffd76a;opacity:0;animation:cf 1.1s cubic-bezier(.45,0,.85,.55) forwards}@keyframes cf{0%{opacity:0;transform:translateY(0) rotateY(0)}12%,85%{opacity:1}100%{opacity:0;transform:translateY(74vh) rotateY(900deg)}}
.rip{left:50%;bottom:7%;width:44px;height:14px;margin-left:-22px;border:2px solid #9ff3ea;border-radius:50%;opacity:0;animation:rp 1.2s ease-out forwards}@keyframes rp{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(8)}}
.shoot{right:9%;top:9%;width:160px;height:3px;border-radius:3px;background:linear-gradient(270deg,#fff,#ffe9a0 30%,transparent);box-shadow:0 0 14px #ffd76a;opacity:0;animation:s2 .9s ease-in forwards}@keyframes s2{0%{opacity:0;transform:translate(0,0) rotate(-27deg)}12%{opacity:1}100%{opacity:0;transform:translate(-62vw,32vh) rotate(-27deg)}}
.sp{width:7px;height:7px;margin:-3px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 10px #ffd76a;animation:sp .9s ease-out forwards}@keyframes sp{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
.ring{left:50%;top:52%;width:70px;height:70px;margin:-35px;border-radius:50%;border:2px solid var(--in);animation:rg .9s ease-out forwards}@keyframes rg{from{opacity:.9;transform:scale(.2)}to{opacity:0;transform:scale(5)}}
.flash{inset:0;box-shadow:inset 0 0 90px 12px #ff3b30aa;animation:fa .7s ease-out forwards}@keyframes fa{to{opacity:0}}
.shk{animation:shk .42s!important}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.bg.swell .sea{transform:translateY(-16px)}.bg.lit b{filter:brightness(1.35);box-shadow:0 0 130px 55px var(--orbg)}
@media(prefers-reduced-motion:reduce){.bg *,.hero,.ent>*,#sh .pn,#sh .bk,.rw.nw{animation:none!important}.sea{transition:none}}
#to.er{background:var(--out);color:#fff;font-weight:600;box-shadow:0 8px 26px #0006}
</style></head><body>

<script>
const $=s=>document.querySelector(s),D=()=>({tx:[],debts:[],goals:[],invs:[],bud:{},cur:'COP',theme:'auto',snd:1,bg:'auto',ts:0});
let S=D(),tab='home',flt='all',q='',cb,dcb,tm,dv='list',cv='plans',amD,amX=0,cloud=null,ct,cl=false,fl2='all',fxk=null,lid=null,pt=null,curTot=0,per='m';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let mo=today().slice(0,7);
try{const x=localStorage.getItem('fin1');if(x)S=Object.assign(D(),JSON.parse(x))}catch(e){}
const push=async()=>{if(cloud)try{await cloud.set({json:JSON.stringify(S),ts:S.ts})}catch(e){}};
const save=()=>{S.ts=Date.now();try{localStorage.setItem('fin1',JSON.stringify(S))}catch(e){}clearTimeout(ct);ct=setTimeout(push,800)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:S.cur,maximumFractionDigits:S.cur==='COP'?0:2}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days=d=>Math.ceil((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const ml=m=>new Date(m+'-15').toLocaleDateString('es',{month:'long',year:'numeric'});
const CO=['Comida','Transporte','Vivienda','Servicios','Salud','Ocio','Compras','Educación','Deudas','Ahorro','Inversión','Otros'],CI=['Salario','Negocio','Inversiones','Regalo','Otros'];

const anal=(m,i,o)=>{const f=y=>m.filter(t=>t.type===y&&t.fx==='f').reduce((s,t)=>s+t.amt,0),iF=f('in'),oF=f('out'),cm=S.debts.reduce((s,d)=>s+(d.n>0&&pend(d)>0?cu(d):0),0),mm=per==='y'?Math.max(1,new Set(m.filter(t=>t.type==='in').map(t=>t.date.slice(0,7))).size):1,r=(iF||i)?cm/((iF||i)/mm)*100:0;

 let n,c2=c,I1;

 AC={x,n,cuota:Math.round(c2*100)/100};
 R.innerHTML=`<div class="rw"><div><small>Intereses que te ahorras</small></div><b class="in" style="font-size:22px">${fmt(Math.max(0,b.I-I1))}</b></div><small>Sin abono pagarías ${fmt(b.I)} en intereses; con el abono, ${fmt(I1)}.</small><small>${n===0?'Con este abono saldarías la deuda.':p?`Terminas en ${n} cuotas en vez de ${b.n}: ${b.n-n} cuotas menos.`:`Nueva cuota de ${fmt(c2)} (baja ${fmt(c-c2)} al mes) durante ${n} cuotas.`}</small>`}

function atab(d){const i=mi(d),c=cu(d),x=amX||0,b=sim(pend(d),i,c);let B=pend(d),rows='',n=0,TI=0,TP=0;const sM=startM(d);

const hv=g=>S.invs.filter(v=>v.goal===g.id),iM=v=>v.rtype==='m'?v.rate/100:Math.pow(1+v.rate/100,1/12)-1,iA=v=>v.rtype==='m'?(Math.pow(1+v.rate/100,12)-1)*100:v.rate;

function proj(g){const L=hv(g),ms=L.map(iM),sv=g.save||0;let a=g.saved,vs=L.map(v=>v.amt),n=0;const tot=()=>a+vs.reduce((s,x)=>s+x,0);
